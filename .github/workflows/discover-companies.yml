name: Discover Companies

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Run discovery script
        run: python discover_companies.py

      - name: Commit updated companies.json
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@github.com"
          git add companies.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-discover new companies"
          git push
